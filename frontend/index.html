<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Weather Service</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-6 space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold tracking-tight text-indigo-400">
                <i class="fa-solid class=fa-cloud-sun-rain mr-2"></i>DevOps Weather
            </h1>
            <p class="text-sm text-slate-400 mt-1">Сервис мониторинга погоды в реальном времени</p>
        </div>

        <div class="flex gap-2">
            <input type="text" id="cityInput" placeholder="Введите город (например, Бендеры)..." 
                   class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
            <button id="searchBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-xl px-4 py-2.5 transition-colors flex items-center gap-2 cursor-pointer">
                <i class="fa-solid fa-magnifying-glass"></i> Найти
            </button>
        </div>

        <div class="text-center">
            <button id="geoBtn" class="text-xs text-indigo-400 hover:text-indigo-300 underline cursor-pointer transition-colors">
                <i class="fa-solid fa-location-crosshairs mr-1"></i> Определить по IP
            </button>
        </div>

        <hr class="border-slate-700">

        <div id="loading" class="hidden text-center py-8">
            <i class="fa-solid fa-spinner animate-spin text-3xl text-indigo-500"></i>
            <p class="text-sm text-slate-400 mt-2">Опрашиваем контейнер бэкенда...</p>
        </div>

        <div id="weatherWidget" class="space-y-6 py-4">
            <div class="text-center">
                <h2 id="cityName" class="text-3xl font-extrabold tracking-tight">---</h2>
                <p class="text-xs text-emerald-400 font-mono bg-emerald-950/50 border border-emerald-800/30 rounded-full px-2 py-0.5 inline-block mt-2">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block mr-1.5 animate-pulse"></span>API Статус: 200 OK
                </p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-950/40 border border-slate-700/50 rounded-xl p-4 flex flex-col items-center">
                    <i class="fa-solid fa-temperature-half text-2xl text-orange-400 mb-2"></i>
                    <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Температура</span>
                    <span id="tempValue" class="text-2xl font-bold mt-1">-- °C</span>
                </div>
                <div class="bg-slate-950/40 border border-slate-700/50 rounded-xl p-4 flex flex-col items-center">
                    <i class="fa-solid fa-wind text-2xl text-sky-400 mb-2"></i>
                    <span class="text-xs text-slate-400 uppercase tracking-wider font-medium">Ветер</span>
                    <span id="windValue" class="text-2xl font-bold mt-1">-- км/ч</span>
                </div>
            </div>
        </div>

        <div id="errorBlock" class="hidden bg-red-950/50 border border-red-800/50 text-red-200 rounded-xl p-4 text-sm flex gap-3 items-start">
            <i class="fa-solid fa-triangle-exclamation text-lg text-red-400 mt-0.5"></i>
            <div>
                <h4 class="font-semibold">Ошибка API</h4>
                <p id="errorText" class="text-xs text-red-300 mt-0.5"></p>
            </div>
        </div>
    </div>

    <script>
        // ВАЖНО: Укажи здесь IP своей виртуалки Ubuntu и порт твоего FastAPI (8000)
        const BACKEND_URL = "api/weather"; 

        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const geoBtn = document.getElementById('geoBtn');
        const loading = document.getElementById('loading');
        const weatherWidget = document.getElementById('weatherWidget');
        const errorBlock = document.getElementById('errorBlock');

        async function getWeatherData(url) {
            // Показываем лоадер, скрываем старые данные и ошибки
            loading.classList.remove('hidden');
            weatherWidget.classList.add('hidden');
            errorBlock.classList.add('hidden');

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || `Ошибка сервера: ${response.status}`);
                }

                // Заполняем интерфейс данными из JSON
                document.getElementById('cityName').innerText = data.city_name;
                document.getElementById('tempValue').innerText = `${data.temperature_2m} °C`;
                document.getElementById('windValue').innerText = `${data.wind_speed_10m} км/ч`;

                weatherWidget.classList.remove('hidden');
            } catch (err) {
                document.getElementById('errorText').innerText = err.message;
                errorBlock.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
            }
        }

        // Слушатели событий на кнопки
        searchBtn.addEventListener('click', () => {
            const city = cityInput.value.trim();
            if (city) getWeatherData(`${BACKEND_URL}?city=${city}`);
        });

        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBtn.click();
        });

        geoBtn.addEventListener('click', () => {
            cityInput.value = '';
            getWeatherData(BACKEND_URL);
        });

        // Автоматический запрос по IP при первой загрузке страницы
        window.addEventListener('DOMContentLoaded', () => getWeatherData(BACKEND_URL));
    </script>
</body>
</html>
