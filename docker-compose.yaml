services:
  backend:
    image: weather_backend
    build: 
      context: ./backend
    container_name: weather_app_back
    ports:
      - "${BACK_PORT}:8000"
    env_file: .env
  nginx:
    image: nginx:alpine
    build:
      context: ./frontend
    container_name: weath_front
    ports:
      - "${FRONT_PORT}:80"
    env_file:
      - .env
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/var/www/frontend:ro