services:
  backend:
    image: weather_backend
    build: 
      context: ./backend
    container_name: weather_app_back
    ports:
      - "${BACK_PORT}:8000"
    env_file: .env
    volumes:
      - ./backend:/app
  nginx:
    build:
      context: ./frontend
    container_name: weath_front
    ports:
      - "${FRONT_PORT}:80"
    env_file:
      - .env
    depends_on:
      - backend
